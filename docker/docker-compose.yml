# Local PostgreSQL for SQLGuard Ninja integration tests and the plan-inspector example.
# Synthetic data only. The password below is a local-development placeholder; never reuse it.
#
#   docker compose -f docker/docker-compose.yml up -d
#   export SQLNINJA_PG_DSN=postgresql://postgres:sqlninja-dev@localhost:55432/postgres
#   pytest -m postgres
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: sqlninja-dev
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    command: ["postgres", "-c", "log_statement=none"]
