[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "relvector"
dynamic = ["version"]
description = "Schema-aware semantic indexes over existing relational databases, with source references back to the rows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "RelVector contributors" }]
keywords = ["sql", "semantic-search", "embeddings", "vector-index", "sqlalchemy", "rag", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "SQLAlchemy>=2.0,<3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Local embedding model (pulls in PyTorch).
local = ["sentence-transformers>=2.3"]
# Optional approximate nearest-neighbour backend (CPU FAISS).
faiss = ["faiss-cpu>=1.8"]
postgres = ["psycopg[binary]>=3.1"]
sqlguard = ["sqlguard-ninja>=0.7,<0.9"]
dev = [
    "relvector[faiss,postgres,sqlguard]",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/Pratik653/RelVector"
Issues = "https://github.com/Pratik653/RelVector/issues"
Changelog = "https://github.com/Pratik653/RelVector/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/relvector/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/relvector"]

[tool.hatch.build.targets.sdist]
include = ["src/relvector", "tests/relvector", "examples/relvector", "docs/relvector", "README.md", "CHANGELOG.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests/relvector"]
addopts = "-ra --strict-markers -p no:cacheprovider --basetemp=.pytest_tmp"
markers = [
    "model: needs a locally cached sentence-transformers model (skipped otherwise)",
    "postgres: needs a disposable PostgreSQL server (RELVECTOR_PG_DSN or pgserver; skipped otherwise)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "C4"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004", "PLW2901", "S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "B017", "PLC0415", "E501"]
"examples/**" = ["S", "T201", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/relvector"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "sqlguard_ninja.*", "pgserver.*", "faiss.*"]
ignore_missing_imports = true
