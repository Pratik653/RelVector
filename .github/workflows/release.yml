name: Release

# Builds and checks the distributions on every run. Publishes to PyPI ONLY when a maintainer
# publishes a GitHub release whose tag equals "v" + the package version. Ordinary pushes,
# pull requests and manual runs never publish. Uses PyPI Trusted Publishing (OIDC): there is
# no PyPI token anywhere, and only the publish job can request an OIDC token, inside the
# protected `pypi` environment.
on:
  release:
    types: [published]
  workflow_dispatch: # build and check only

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Release tag must match the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/relvector/_version.py').read_text()).group(1))")
          echo "tag=$TAG package=$version"
          test "$TAG" = "v$version"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Wheel contains only the relvector package
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          stray = [n for n in names if not n.startswith(("relvector/", "relvector-"))]
          assert not stray, stray
          print(len(names), "files, relvector only")
          EOF
      - name: Smoke-test the wheel outside the source tree
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cp examples/relvector/orders_shipments.py /tmp/example.py
          cd /tmp
          /tmp/smoke/bin/python -I /tmp/example.py --provider hashing --workdir /tmp/rv-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/relvector/
    permissions:
      contents: read
      id-token: write # OIDC token for Trusted Publishing; only this job gets it
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
