name: Bug report
description: Something does not work as documented (not a security vulnerability).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        **Security vulnerabilities must be reported privately** (see SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Schema (DDL), a few synthetic rows, the mapping and the call. Synthetic data only.
      render: python
    validations: {required: true}
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: relvector 0.1.0, SQLAlchemy 2.1.6, PostgreSQL 16 / SQLite 3.45, Python 3.12
    validations: {required: true}
