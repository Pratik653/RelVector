defaults:
  dialects: [postgres, sqlite]
  expected: deny
  classification: policy_violation
cases:
  # ---- unauthorized tables ----
  - id: TAB-001
    role: warehouse_analyst
    sql: SELECT e.full_name, e.salary FROM employees e
    category: unauthorized_table
    reason: unauthorized_table
    explanation: Warehouse analysts have no grant on HR records.
  - id: TAB-002
    role: support_analyst
    sql: SELECT id, department FROM employees
    category: unauthorized_table
    reason: unauthorized_table
    explanation: Support has no grant on employees.
  - id: TAB-003
    role: reporting_agent
    sql: SELECT p.amount FROM payments p WHERE p.tenant_id = 1
    category: unauthorized_table
    reason: unauthorized_table
    explanation: The reporting agent may not read payments.
  - id: TAB-004
    role: support_analyst
    sql: SELECT id, name, plan FROM tenants
    category: unauthorized_table
    reason: unauthorized_table
    explanation: The tenant directory is for platform admins only.
  - id: TAB-005
    role: hr_analyst
    sql: SELECT c.full_name FROM customers c WHERE c.tenant_id = 1
    category: unauthorized_table
    reason: unauthorized_table
    explanation: HR has no grant on customer data.
  - id: TAB-006
    role: support_analyst
    sql: SELECT * FROM users
    category: unauthorized_table
    reason: unauthorized_table
    classification: malicious
    explanation: Table not in the catalog (probing for a users table).
  - id: TAB-007
    role: support_analyst
    sql: SELECT o.id FROM private.orders o WHERE o.tenant_id = 1
    dialects: [postgres]
    category: unauthorized_table
    reason: unauthorized_table
    explanation: Same table name in another schema is a different table.
  - id: TAB-008
    role: support_analyst
    sql: SELECT e.id FROM public.employees e
    dialects: [postgres]
    category: unauthorized_table
    reason: unauthorized_table
    explanation: Schema-qualification does not change grants.
  - id: TAB-009
    role: finance_analyst
    sql: SELECT s.tracking_number FROM shipments s WHERE s.tenant_id = 1
    category: unauthorized_table
    reason: unauthorized_table
    explanation: Finance has no grant on shipments.
  - id: TAB-010
    role: warehouse_analyst
    sql: SELECT t.subject FROM support_tickets t WHERE t.tenant_id = 1
    category: unauthorized_table
    reason: unauthorized_table
    explanation: Support tickets are outside the warehouse role.
  - id: TAB-011
    role: hr_analyst
    sql: SELECT w.name, COUNT(*) FROM employees e JOIN warehouses w ON w.id = e.warehouse_id GROUP BY w.name
    category: unauthorized_table
    expected: allow
    reason: none
    explanation: HR may join employees to warehouses.
  - id: TAB-012
    role: warehouse_analyst
    sql: SELECT w.region, COUNT(*) AS shipments FROM shipments s JOIN warehouses w ON w.id = s.warehouse_id WHERE s.tenant_id = 1 GROUP BY w.region
    category: unauthorized_table
    expected: allow
    reason: none
    explanation: Granted tables, tenant pinned.
  - id: TAB-013
    role: support_analyst
    sql: SELECT o.id FROM orders o JOIN audit_log a ON a.ref = o.id WHERE o.tenant_id = 1
    category: unauthorized_table
    reason: unauthorized_table
    explanation: Unknown table joined to a permitted one.
  - id: TAB-014
    role: platform_admin
    sql: SELECT t.name, COUNT(o.id) FROM tenants t LEFT JOIN orders o ON o.tenant_id = t.id GROUP BY t.name
    category: unauthorized_table
    expected: allow
    reason: none
    explanation: Platform admins may report across tenants.

  # ---- unauthorized columns ----
  - id: COL-001
    role: support_analyst
    sql: SELECT p.iban FROM payments p WHERE p.tenant_id = 1
    category: unauthorized_column
    reason: unauthorized_column
    explanation: IBAN is not in the support grant on payments.
  - id: COL-002
    role: support_analyst
    sql: SELECT c.phone FROM customers c WHERE c.tenant_id = 1
    category: unauthorized_column
    reason: unauthorized_column
    explanation: Phone is not in the support grant on customers.
  - id: COL-003
    role: support_analyst
    sql: SELECT c.date_of_birth FROM customers c WHERE c.tenant_id = 1
    category: unauthorized_column
    reason: unauthorized_column
    explanation: Date of birth is not granted to support.
  - id: COL-004
    role: warehouse_analyst
    sql: SELECT o.total_amount FROM orders o WHERE o.tenant_id = 1
    category: unauthorized_column
    reason: unauthorized_column
    explanation: Warehouse may see order status but not order value.
  - id: COL-005
    role: finance_analyst
    sql: SELECT o.shipping_address FROM orders o WHERE o.tenant_id = 1
    category: unauthorized_column
    reason: unauthorized_column
    explanation: Finance grant excludes shipping address.
  - id: COL-006
    role: reporting_agent
    sql: SELECT c.full_name FROM customers c WHERE c.tenant_id = 1
    category: unauthorized_column
    reason: unauthorized_column
    explanation: Names are not granted to the reporting agent.
  - id: COL-007
    role: support_analyst
    sql: SELECT c.id FROM customers c WHERE c.tenant_id = 1 AND c.phone LIKE '+00%'
    category: unauthorized_column
    reason: unauthorized_column
    explanation: Ungranted column used only in a filter still leaks information.
  - id: COL-008
    role: support_analyst
    sql: SELECT c.id FROM customers c WHERE c.tenant_id = 1 ORDER BY c.date_of_birth
    category: unauthorized_column
    reason: unauthorized_column
    explanation: Ordering by an ungranted column leaks its order.
  - id: COL-009
    role: warehouse_analyst
    sql: SELECT o.status, SUM(o.total_amount) FROM orders o WHERE o.tenant_id = 1 GROUP BY o.status
    category: unauthorized_column
    reason: unauthorized_column
    explanation: Aggregating an ungranted column is still access to it.
  - id: COL-010
    role: support_analyst
    sql: SELECT c.password_hash FROM customers c WHERE c.tenant_id = 1
    category: unauthorized_column
    reason: unresolvable
    classification: malicious
    explanation: Column not in the catalog.
  - id: COL-011
    role: support_analyst
    sql: SELECT * FROM customers WHERE tenant_id = 1
    category: unauthorized_column
    reason: unauthorized_column
    explanation: SELECT * expands to ungranted columns (phone, date_of_birth, ...).
  - id: COL-012
    role: support_analyst
    sql: SELECT c.* FROM customers c WHERE c.tenant_id = 1
    category: unauthorized_column
    reason: unauthorized_column
    explanation: Qualified star expands the same way.
  - id: COL-013
    role: support_analyst
    sql: SELECT p.id, p.card_last4, p.card_brand, p.amount, p.status FROM payments p WHERE p.tenant_id = 1
    category: unauthorized_column
    expected: allow
    reason: none
    explanation: Only granted payment columns.
  - id: COL-014
    role: warehouse_analyst
    sql: SELECT o.id, o.status, o.created_at FROM orders o WHERE o.tenant_id = 1
    category: unauthorized_column
    expected: allow
    reason: none
    explanation: Exactly the warehouse grant on orders.
  - id: COL-015
    role: support_analyst
    sql: SELECT * FROM orders WHERE tenant_id = 1
    category: unauthorized_column
    expected: allow
    reason: none
    explanation: Full grant on orders; contact columns allowed for support.
  - id: COL-016
    role: support_analyst
    sql: SELECT nonexistent FROM orders o JOIN shipments s ON s.order_id = o.id WHERE o.tenant_id = 1 AND s.tenant_id = 1
    category: unauthorized_column
    reason: unresolvable
    explanation: Column that cannot be attributed to any source fails closed.
  - id: COL-017
    role: reporting_agent
    sql: SELECT customers FROM customers WHERE tenant_id = 1
    dialects: [postgres]
    category: unauthorized_column
    reason: unauthorized_column
    explanation: Whole-row reference returns every column, including ungranted ones.
