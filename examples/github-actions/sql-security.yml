# Example consumer workflow. Copy to .github/workflows/sql-security.yml in your repository.
#
# 1. Run `sqlninja init` and adapt policies/policy.yaml and benchmarks/cases/ to your schema.
# 2. Run `sqlninja benchmark run` locally, review the result, then
#    `sqlninja benchmark baseline` and commit benchmarks/baseline.json.
# 3. Replace <commit-sha> with the full commit SHA of the SQLGuard Ninja release you reviewed.
#    Pinning to a SHA (not a tag) prevents a moved tag from changing what runs in your CI.
name: SQL Security Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sql-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: SQL policy regression gate
        uses: Pratik653/SQLGuard_Ninjapy@<commit-sha> # vX.Y.Z
        with:
          config: sqlninja.yaml
          # Pull requests that add cases still require every new unsafe case to be blocked.
          allow-benchmark-change: ${{ github.event_name == 'pull_request' }}
